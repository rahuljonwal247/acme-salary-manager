# Local development:   docker compose up -d db          (then run api/web with npm run dev)
# Full stack:          docker compose --profile app up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: acme
      POSTGRES_PASSWORD: acme
      POSTGRES_DB: salaries
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acme -d salaries"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    profiles: [app]
    build: ./backend
    environment:
      DATABASE_URL: postgresql://acme:acme@db:5432/salaries?schema=public
      CORS_ORIGINS: http://localhost:3000
      # local demo only — use a long random secret anywhere else
      JWT_SECRET: local-docker-demo-secret-change-me-0123456789
      # optional: enables the Claude-powered assistant
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  web:
    profiles: [app]
    build: ./frontend
    environment:
      # the web server (pages + /bff proxy) talks to the API over the compose network;
      # the browser never calls the API directly
      API_URL: http://api:4000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
