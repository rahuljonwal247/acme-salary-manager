# Local development:   docker compose up -d db          (then run api/web with npm run dev)
# Full stack:          docker compose --profile app up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: acme
      POSTGRES_PASSWORD: acme
      POSTGRES_DB: salaries
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acme -d salaries"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    profiles: [app]
    build: ./backend
    environment:
      DATABASE_URL: postgresql://acme:acme@db:5432/salaries?schema=public
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  web:
    profiles: [app]
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
    environment:
      # server components talk to the API over the compose network
      API_URL: http://api:4000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
