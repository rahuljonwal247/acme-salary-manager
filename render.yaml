# Render Blueprint: New > Blueprint > select this repo. Creates Postgres + API + web.
# Secrets marked `generateValue` are created by Render; read the seed passwords in the dashboard
# (api service > Environment) to sign in the first time, then change them in the app.
databases:
  - name: acme-salaries-db
    plan: free
    databaseName: salaries
    user: acme

services:
  - type: web
    name: acme-salary-api
    runtime: node
    rootDir: backend
    plan: free
    # --include=dev: NODE_ENV=production would otherwise skip TypeScript/Prisma CLI/tsx needed to build & seed
    buildCommand: npm ci --include=dev && npm run build
    # migrate -> create seed users + 10k employees if empty -> start
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: acme-salaries-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_ADMIN_PASSWORD
        generateValue: true
      - key: SEED_HR_PASSWORD
        generateValue: true
      - key: CORS_ORIGINS
        value: https://acme-salary-web.onrender.com
      # optional — set in the dashboard to enable the Claude-powered assistant
      - key: ANTHROPIC_API_KEY
        sync: false

  - type: web
    name: acme-salary-web
    runtime: node
    rootDir: frontend
    plan: free
    # the standalone server needs the static assets copied next to it
    buildCommand: npm ci --include=dev && npm run build && cp -r .next/static .next/standalone/.next/static && cp -r public .next/standalone/public
    startCommand: HOSTNAME=0.0.0.0 node .next/standalone/server.js
    envVars:
      - key: NODE_ENV
        value: production
      # server-side only: pages and the /bff proxy call the API; the browser never does
      - key: API_URL
        value: https://acme-salary-api.onrender.com
